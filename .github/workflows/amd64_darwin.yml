---
name: AMD64_DARWIN

on:
  workflow_call:
    inputs:
      os:
        default: macos-15-intel
        required: false
        type: string
      release:
        default: https://github.com/VictorMiasnikov/cm3/releases/download/d5.12.1-ZZYYXX-20260509_19-45
        required: false
        type: string
      bootstrap:
        default: cm3-boot-AMD64_DARWIN-d5.12.1-ZZYYXX-20260509_19-45.tar.xz
        required: false
        type: string

jobs:
  build-and-test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 80

    strategy:
      fail-fast: false
      matrix:
        backend: [c, gcc]

    env:
      CM3_TARGET: AMD64_DARWIN

    steps:
    - name: Install prerequisites
      run: |
        brew update
        brew install libxaw libxft ninja xquartz

    - name: Define install location
      run: |
        echo "CM3_INSTALL=$(dirname "$PWD")/install" >> $GITHUB_ENV

    - name: Install bootstrap release
      run: |
        mkdir ../bootstrap ../build
        curl --location --silent "${{ inputs.release }}/${{ inputs.bootstrap }}" | gtar Jxf - --directory=../bootstrap --strip-components=1
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${CM3_INSTALL}"
        cmake --build ../build
        cmake --install ../build
        echo "${CM3_INSTALL}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v4

    - name: Build everything
      run: |
        scripts/concierge.py full-upgrade --backend "${{ matrix.backend }}" headless -m3gdb

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML
      working-directory: m3-sys/m3tests

    - name: Generate test report
      uses: dorny/test-reporter@v2
      with:
        name: ${{ format('m3tests ({0}, {1})', env.CM3_TARGET, matrix.backend) }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit

    - name: Package build artifacts
      run: |
        ARCHIVE_NAME="cm3-${{ env.CM3_TARGET }}-${{ matrix.backend }}.tar.xz"
        echo "Creating archive $ARCHIVE_NAME from ${CM3_INSTALL}..."
        # -C "${CM3_INSTALL}" . архивирует содержимое папки, а не саму папку с именем "install"
        tar -cJf "$ARCHIVE_NAME" -C "${CM3_INSTALL}" .
        echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cm3-build-${{ env.CM3_TARGET }}-${{ matrix.backend }}
        path: ${{ env.ARCHIVE_NAME }}
        if-no-files-found: error
        retention-days: 7