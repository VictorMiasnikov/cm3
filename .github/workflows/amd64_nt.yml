---
name: AMD64_NT

on:
  workflow_call:
    inputs:
      os:
        default: windows-latest
        required: false
        type: string
      release:
        default: https://github.com/VictorMiasnikov/cm3/releases/download/d5.12.1-ZZYYXX-20261110
        required: false
        type: string
      bootstrap:
        default: cm3-boot-AMD64_NT-d5.12.1-ZZYYXX-20261110.7z
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60

    defaults:
      run: {shell: cmd}

    env:
      CM3_TARGET: AMD64_NT

    steps:
    - name: Install command-line tools
      run: |
        choco install wget
        rem procdump lets ci-watchdog.py dump a hung cm3; the build runs without it.
        choco install procdump || echo procdump not installed

    - name: Setup SDK environment
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Define install location
      run: |
        for %%I in (..) do echo CM3_INSTALL=%%~fI\install\cm3>>%GITHUB_ENV%

    - name: Install bootstrap release
      run: |
        mkdir ..\build ..\install
        cd ..\install
        wget --quiet "${{ inputs.release }}/${{ inputs.bootstrap }}"
        7z x -o.. "${{ inputs.bootstrap }}"
        cmake -S ..\bootstrap -B ..\build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=%CM3_INSTALL% -A x64
        cmake --build ..\build --config RelWithDebInfo
        cmake --install ..\build --config RelWithDebInfo
        echo %CM3_INSTALL%\bin>>%GITHUB_PATH%

    - name: Fetch sources
      uses: actions/checkout@v6

    - name: Build everything
      run: |
        cm3 -version
        python3 scripts\ci-watchdog.py -- python3 scripts\concierge.py full-upgrade all -caltech-other -caltech-parser -m3-scheme
        cm3 -version

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        python3 ..\..\scripts\ci-watchdog.py --dumps ..\..\dumps -- cm3 -DHTML
      working-directory: m3-sys\m3tests

    - name: Check m3tests against known failures
      if: ${{ !cancelled() }}
      run: |
        python3 m3-sys\m3tests\check-results.py m3-sys\m3tests\m3tests-results.xml m3-sys\m3tests\known-failures\%CM3_TARGET%-c

    - name: Generate test report
      uses: dorny/test-reporter@v3
      with:
        name: ${{ format('m3tests ({0}, {1})', env.CM3_TARGET, matrix.backend) }}
        fail-on-error: false
        max-annotations: 49
        path: m3-sys/m3tests/m3tests-results.xml
        reporter: java-junit

    - name: Upload dumps of a hung cm3
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: hang-dumps-AMD64_NT
        path: dumps
        if-no-files-found: ignore
        retention-days: 14

    - name: Package build artifacts
      run: |
        set ARCHIVE_NAME=cm3-%CM3_TARGET%.7z
        echo ARCHIVE_NAME=%ARCHIVE_NAME%>>%GITHUB_ENV%
        echo Creating archive %ARCHIVE_NAME% from %CM3_INSTALL%...
        cd /d "%CM3_INSTALL%"
        7z a -t7z "%GITHUB_WORKSPACE%\%ARCHIVE_NAME%" .
      shell: cmd

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: cm3-build-${{ env.CM3_TARGET }}
        path: ${{ env.ARCHIVE_NAME }}
        if-no-files-found: error
        retention-days: 77
