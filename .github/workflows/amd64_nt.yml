---
name: AMD64_NT

on:
  workflow_call:
    inputs:
      os:
        default: windows-latest
        required: false
        type: string
      release:
        default: https://github.com/VictorMiasnikov/cm3/releases/download/d5.12.1-ZZYYXX-20260509_19-45
        required: false
        type: string
      bootstrap:
        default: cm3-boot-AMD64_NT-d5.12.1-ZZYYXX-20260509_19-45.7z
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 35

    defaults:
      run: {shell: cmd}

    env:
      CM3_TARGET: AMD64_NT

    steps:
    - name: Install command-line tools
      run: |
        choco install wget

    - name: Setup SDK environment
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Define install location
      run: |
        echo CM3_INSTALL=%CD%\..\install\cm3>>%GITHUB_ENV%

    - name: Install bootstrap release
      run: |
        mkdir ..\build ..\install
        cd ..\install
        wget --quiet "${{ inputs.release }}/${{ inputs.bootstrap }}"
        7z x -o.. "${{ inputs.bootstrap }}"
        cmake -S ..\bootstrap -B ..\build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_INSTALL_PREFIX=%CM3_INSTALL% -A x64
        cmake --build ..\build --config RelWithDebInfo
        cmake --install ..\build --config RelWithDebInfo
        echo %CM3_INSTALL%\bin>>%GITHUB_PATH%

    - name: Fetch sources
      uses: actions/checkout@v4

    - name: Build everything
      run: |
        cm3 -version
        python3 scripts\concierge.py full-upgrade headless -m3gdb -caltech-other -caltech-parser -m3-scheme
        cm3 -version

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML
      working-directory: m3-sys\m3tests

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cm3-build-files-${{ env.CM3_TARGET }}
        path: |
          ${{ env.CM3_INSTALL }}/bin
          ${{ env.CM3_INSTALL }}/lib
          ${{ env.CM3_INSTALL }}/pkg
          ${{ env.CM3_INSTALL }}/man
        if-no-files-found: warn
        retention-days: 7
