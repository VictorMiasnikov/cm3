---
name: AMD64_MINGW

on:
  workflow_call:
    inputs:
      os:
        default: windows-latest
        required: false
        type: string
      release:
        default: https://github.com/VictorMiasnikov/cm3/releases/download/d5.12.1-ZZYYXX-20260603
        required: false
        type: string
      bootstrap:
        default: cm3-boot-AMD64_NT-d5.12.1-ZZYYXX-20260603.7z
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 25

    defaults:
      run:
        shell: msys2 {0}

    env:
      CM3_TARGET: AMD64_MINGW

    steps:
    - name: Install command-line tools
      uses: msys2/setup-msys2@v2
      with:
        msystem: mingw64
        install: >-
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-toolchain
          p7zip
          wget

    - name: Define install location
      run: |
        WIN_PARENT=$(cygpath -m "$(dirname "$PWD")")
        echo "CM3_INSTALL=${WIN_PARENT}/install/cm3" >> $GITHUB_ENV
        echo "CM3_INSTALL_MSYS=$(dirname "$PWD")/install/cm3" >> $GITHUB_ENV

    - name: Install bootstrap release
      env:
        CMAKE_LIBRARY_PATH: /mingw64/x86_64-w64-mingw32/lib
      run: |
        mkdir ../build ../install
        cd ../install
        wget --quiet "${{ inputs.release }}/${{ inputs.bootstrap }}"
        7z x -o.. "${{ inputs.bootstrap }}"
        cmake -S ../bootstrap -B ../build -G Ninja -DCMAKE_INSTALL_PREFIX="${{ env.CM3_INSTALL_MSYS }}" -DCMAKE_LIBRARY_PATH="${CMAKE_LIBRARY_PATH}"
        cmake --build ../build
        cmake --install ../build

        echo "${{ env.CM3_INSTALL_MSYS }}/bin" >> $GITHUB_PATH

    - name: Fetch sources
      uses: actions/checkout@v6

    - name: Build everything
      run: |
        python3 scripts/concierge.py full-upgrade headless -m3gdb -caltech-other -caltech-parser -m3-scheme

    - name: Run compiler validation suite
      continue-on-error: true
      run: |
        cm3 -DHTML
      working-directory: m3-sys/m3tests

    - name: Package build artifacts
      run: |
        ARCHIVE_NAME="cm3-${{ env.CM3_TARGET }}.7z"
        echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
        echo "Creating archive $ARCHIVE_NAME from ${CM3_INSTALL_MSYS}..."
        cd "${CM3_INSTALL_MSYS}"
        7z a -t7z "${GITHUB_WORKSPACE}/${ARCHIVE_NAME}" .
      shell: msys2 {0}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: cm3-build-${{ env.CM3_TARGET }}
        path: ${{ env.ARCHIVE_NAME }}
        if-no-files-found: error
        retention-days: 77
